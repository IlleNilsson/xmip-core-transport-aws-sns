# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-transport-aws-sns"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-transport-aws-sns"
description = "Amazon SNS transport: Signature Version 4 over the Query API — publish a Stream as a message to a topic, and receive as the HTTP endpoint a subscription delivers to, confirming itself and taking each notification as a Stream — a topic ARN is a Location. A xmip-core-transport technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md).
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main" }
# The endpoint parser, the request and its answer, and
# TLS behind the `tls` feature — one TLS stack in the estate, the http
# technology's (ADR-0033).
http = { package = "xmip-core-transport-http", git = "https://github.com/IlleNilsson/xmip-core-transport-http", branch = "main" }
# Percent-encoding (RFC 3986), written once for the estate.
net = { package = "xmip-core-library-net", git = "https://github.com/IlleNilsson/xmip-core-library-net", branch = "main" }
# Signature Version 4 and the Query API. They came from the aws-sqs
# technology until 2026-09-14; a technology never imports a sibling for
# them, and what AWS speaks is the AWS crate's (ADR-0044, the owner's
# ruling of 2026-09-22).
aws = { package = "xmip-core-transport-aws", git = "https://github.com/IlleNilsson/xmip-core-transport-aws", branch = "main" }
# The API answers in JSON, and serde reads it.
serde_json = "1"

[features]
default = []
# HTTPS endpoints. Off by default, as it is in the http technology.
tls = ["http/tls"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
