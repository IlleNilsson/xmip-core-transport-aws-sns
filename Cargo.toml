[package]
name = "xmip-core-transport-aws-sns"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-transport-aws-sns"
description = "Amazon SNS transport: Signature Version 4 over the Query API — publish a Stream as a message to a topic, and receive as the HTTP endpoint a subscription delivers to, confirming itself and taking each notification as a Stream — a topic ARN is a Location. A xmip-core-transport technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). Its declaration takes the capability's `timeout`
# (`transport::configured::timeout`).
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main" }
# The settings this technology declares (xcore::settings), read through
# transport::Configured (ADR-0064, amendment 2026-09-26).
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }
# The endpoint parser, the request and its answer, and
# TLS behind the `tls` feature — one TLS stack in the estate, the http
# technology's (ADR-0033).
http = { package = "xmip-core-transport-http", git = "https://github.com/IlleNilsson/xmip-core-transport-http", branch = "main", optional = true }
# Percent-encoding (RFC 3986), written once for the estate, HTTP/1.1 on the
# wire (`net::http`) and the URL an endpoint is (`net::Endpoint`).
net = { package = "xmip-core-library-net", git = "https://github.com/IlleNilsson/xmip-core-library-net", branch = "main", optional = true }
# Signature Version 4 and the Query API. They came from the aws-sqs
# technology until 2026-09-14; a technology never imports a sibling for
# them, and what AWS speaks is the AWS crate's (ADR-0044, the owner's
# ruling of 2026-09-22). Its declaration alone where this crate is
# (`access_key::ACCESS_KEY_ID`).
aws = { package = "xmip-core-transport-aws", git = "https://github.com/IlleNilsson/xmip-core-transport-aws", branch = "main", default-features = false }
# The flat XML the Query API answers in, read by local name (`codec::xml`).
codec = { package = "xmip-core-library-codec", git = "https://github.com/IlleNilsson/xmip-core-library-codec", branch = "main", optional = true }
# The API answers in JSON, and serde reads it.
serde_json = { version = "1", optional = true }

[dev-dependencies]
# A Location's secret held in memory for the tests, from the capability's
# test support and never a production build (ADR-0044).
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main", features = ["test-support"] }

[features]
# The code and its declaration: the transport guide's "The declaration",
# module/core/capability/transport/doc/adding-a-transport.md.
default = ["declaration", "aws/default", "dep:http", "dep:net", "dep:codec", "dep:serde_json"]
# The declaration alone, the AWS crate's `access_key_id` among its settings.
declaration = ["aws/declaration"]
# HTTPS endpoints: the http technology's `tls`, off by default as there.
tls = ["default", "http/tls"]

[lints]
workspace = true
